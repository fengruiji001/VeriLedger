# Example 2: how detection and audit cost change as counterparties join the shared ledger.
name: Audit regimes under partial adoption
experiment: audit
seed: 2026
replications: 30
economy:
  adoption: 0.5
misstatements:
  backdate: 0.3
  fictitious: 0.01
  inflate: 0.01
  duplicate: 0.005
  round_trip: 4
  tamper: 0.005
regimes: [sampling, ledger, crossledger]
regime_params:
  crossledger:
    psi_backend: plain   # same matches as x25519, faster for Monte Carlo runs
sweep:
  economy.adoption: [0.0, 0.25, 0.5, 0.75, 1.0]
